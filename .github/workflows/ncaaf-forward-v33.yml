name: NCAAF Kalshi forward validation v3.3 (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/ncaaf_forward_audit_v33.py'
      - 'models/test_ncaaf_forward_v33.py'
      - 'models/ncaaf_settlement_verify_v34.py'
      - 'models/test_ncaaf_settlement_v34.py'
      - 'models/ncaaf_game_eligibility_v35.py'
      - 'models/test_ncaaf_game_eligibility_v35.py'
      - 'models/ncaaf_primary_report_evidence_v35.py'
      - 'models/test_ncaaf_primary_report_v35.py'
      - 'models/ncaaf_official_report_discovery_v35.py'
      - 'models/test_ncaaf_official_discovery_v35.py'
      - 'research/ncaaf-primary-availability-input.json'
      - 'models/ncaaf_supplemental_availability_v36.py'
      - 'models/test_ncaaf_supplemental_v36.py'
      - 'models/ncaaf_availability_triage_v37.py'
      - 'models/test_ncaaf_availability_triage_v37.py'
      - '.github/workflows/ncaaf-forward-v33.yml'
  schedule:
    - cron: '13 * * * 5,6,0,1'
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Offline fee, depth, time-window and settlement safety tests
        run: |
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_forward_v33.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_settlement_v34.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_game_eligibility_v35.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_primary_report_v35.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_official_discovery_v35.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_supplemental_v36.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_availability_triage_v37.py' -v
  forward:
    if: github.event_name != 'push'
    needs: checks
    concurrency:
      group: ncaaf-forward-v33
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Sample market depth and series fees and update prospective research only
        run: |
          python models/ncaaf_forward_audit_v33.py \
            --research dashboard/ncaaf-v32-research.json \
            --archive-dir research/ncaaf-forward \
            --health dashboard/ncaaf-v33-health.json \
            --contracts 1
      - name: Independent game-final and Kalshi settlement corroboration
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "CFBD secret unavailable - cannot independently verify settlements" >&2
            exit 1
          fi
          python models/ncaaf_settlement_verify_v34.py             --archive-dir research/ncaaf-forward             --health dashboard/ncaaf-v34-settlement-health.json
      - name: Discover candidate direct game report links on official conference sites
        run: |
          python models/ncaaf_official_report_discovery_v35.py             --queue dashboard/ncaaf-v34-availability-health.json             --output dashboard/ncaaf-v35-source-discovery.json
      - name: Cross-reference optional third-party matchup report leads (never verify player status)
        run: |
          python models/ncaaf_supplemental_availability_v36.py             --queue dashboard/ncaaf-v34-availability-health.json             --output dashboard/ncaaf-v36-secondary-leads.json
      - name: Capture unverified position-QB risk flags for primary-source follow-up
        run: |
          python models/ncaaf_availability_triage_v37.py \
            --source dashboard/ncaaf-v36-secondary-leads.json \
            --output dashboard/ncaaf-v37-availability-triage.json
      - name: Verify submitted direct conference game reports and exact QB excerpts
        run: |
          python -m pip install 'pypdf>=5,<7' -q
          python models/ncaaf_primary_report_evidence_v35.py             --queue dashboard/ncaaf-v34-availability-health.json             --input research/ncaaf-primary-availability-input.json \
            --discovery dashboard/ncaaf-v35-source-discovery.json             --output dashboard/ncaaf-v35-verified-availability.json
      - name: Build individual matchup eligibility blockers (never place paper picks)
        run: |
          python models/ncaaf_game_eligibility_v35.py             --research dashboard/ncaaf-v32-research.json             --availability dashboard/ncaaf-v35-verified-availability.json             --model dashboard/ncaaf-v32-health.json             --settlement dashboard/ncaaf-v34-settlement-health.json \
            --supplemental dashboard/ncaaf-v36-secondary-leads.json \
            --triage dashboard/ncaaf-v37-availability-triage.json \
            --archive-dir research/ncaaf-forward             --output dashboard/ncaaf-v35-eligibility.json
      - name: Validate data shape and research-only gates
        run: |
          python - <<'PY'
          import json,glob
          d=json.load(open("dashboard/ncaaf-v33-health.json"))
          assert d["production_eligible"] is False
          assert d["official_eligible"] is False
          assert d["shadow_eligible"] is False
          a=json.load(open("dashboard/ncaaf-v35-verified-availability.json"))
          assert a["official_eligible"] is False
          assert all(not g.get("model_eligible",False) for g in a["game_review_queue"])
          e=json.load(open("dashboard/ncaaf-v35-eligibility.json"))
          t=json.load(open("dashboard/ncaaf-v37-availability-triage.json"))
          assert t["official_eligible"] is False
          assert all(not x.get("official_qb_verified") and not x.get("used_to_adjust_probabilities") for x in t["games"])
          assert e["production_eligible"] is False and e["official_eligible"] is False
          assert e["games_blocked"]==e["matched_games"]
          assert all(not x["official_eligible"] and not x["shadow_eligible"] for x in e["games"])
          v=json.load(open("dashboard/ncaaf-v34-settlement-health.json"))
          assert v["production_eligible"] is False
          assert v["official_eligible"] is False
          assert v["shadow_eligible"] is False
          for path in glob.glob("research/ncaaf-forward/*.json"):
              a=json.load(open(path))
              assert a["sport"]=="NCAAF"
              assert all(x["research_only"] and not x["official_eligible"] and not x["shadow_eligible"] for x in a["observations"])
          print("Research-only forward data validation passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ncaaf-forward-research-v33
          path: |
            dashboard/ncaaf-v33-health.json
            dashboard/ncaaf-v34-settlement-health.json
            dashboard/ncaaf-v35-eligibility.json
            dashboard/ncaaf-v35-verified-availability.json
            dashboard/ncaaf-v35-source-discovery.json
            dashboard/ncaaf-v36-secondary-leads.json
            dashboard/ncaaf-v37-availability-triage.json
          retention-days: 14
      - name: Commit forward evidence only, never official picks or accounts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/ncaaf-v33-health.json dashboard/ncaaf-v34-settlement-health.json dashboard/ncaaf-v35-eligibility.json dashboard/ncaaf-v35-verified-availability.json dashboard/ncaaf-v35-source-discovery.json dashboard/ncaaf-v36-secondary-leads.json dashboard/ncaaf-v37-availability-triage.json research/ncaaf-forward/
          if ! git diff --cached --quiet; then
            git commit -m "Archive NCAAF read-only orderbook and settlement research [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published research safely"
                exit 0
              fi
              echo "main moved concurrently; retrying ($attempt of 5)" >&2
              sleep $((attempt*2))
            done
            echo "Could not publish research after 5 retries" >&2
            exit 1
          else
            echo "No forward changes"
          fi
