name: NCAAF Kalshi forward validation v3.3 (read only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/ncaaf_forward_audit_v33.py'
      - 'models/test_ncaaf_forward_v33.py'
      - 'models/ncaaf_settlement_verify_v34.py'
      - 'models/test_ncaaf_settlement_v34.py'
      - 'models/ncaaf_game_eligibility_v35.py'
      - 'models/test_ncaaf_game_eligibility_v35.py'
      - '.github/workflows/ncaaf-forward-v33.yml'
  schedule:
    - cron: '13 * * * 5,6,0,1'
permissions:
  contents: read
concurrency:
  group: ncaaf-forward-v33
  cancel-in-progress: false
jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline fee, depth, time-window and settlement safety tests
        run: |
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_forward_v33.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_settlement_v34.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_game_eligibility_v35.py' -v
      - name: Sample market depth and series fees and update prospective research only
        run: |
          python models/ncaaf_forward_audit_v33.py \
            --research dashboard/ncaaf-v32-research.json \
            --archive-dir research/ncaaf-forward \
            --health dashboard/ncaaf-v33-health.json \
            --contracts 1
      - name: Independent game-final and Kalshi settlement corroboration
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then
            echo "CFBD secret unavailable - cannot independently verify settlements" >&2
            exit 1
          fi
          python models/ncaaf_settlement_verify_v34.py             --archive-dir research/ncaaf-forward             --health dashboard/ncaaf-v34-settlement-health.json
      - name: Build individual matchup eligibility blockers (never place paper picks)
        run: |
          python models/ncaaf_game_eligibility_v35.py             --research dashboard/ncaaf-v32-research.json             --availability dashboard/ncaaf-v34-availability-health.json             --model dashboard/ncaaf-v32-health.json             --settlement dashboard/ncaaf-v34-settlement-health.json             --archive-dir research/ncaaf-forward             --output dashboard/ncaaf-v35-eligibility.json
      - name: Validate data shape and research-only gates
        run: |
          python - <<'PY'
          import json,glob
          d=json.load(open("dashboard/ncaaf-v33-health.json"))
          assert d["production_eligible"] is False
          assert d["official_eligible"] is False
          assert d["shadow_eligible"] is False
          e=json.load(open("dashboard/ncaaf-v35-eligibility.json"))
          assert e["production_eligible"] is False and e["official_eligible"] is False
          assert e["games_blocked"]==e["matched_games"]
          assert all(not x["official_eligible"] and not x["shadow_eligible"] for x in e["games"])
          v=json.load(open("dashboard/ncaaf-v34-settlement-health.json"))
          assert v["production_eligible"] is False
          assert v["official_eligible"] is False
          assert v["shadow_eligible"] is False
          for path in glob.glob("research/ncaaf-forward/*.json"):
              a=json.load(open(path))
              assert a["sport"]=="NCAAF"
              assert all(x["research_only"] and not x["official_eligible"] and not x["shadow_eligible"] for x in a["observations"])
          print("Research-only forward data validation passed")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ncaaf-forward-research-v33
          path: |
            dashboard/ncaaf-v33-health.json
            dashboard/ncaaf-v34-settlement-health.json
            dashboard/ncaaf-v35-eligibility.json
          retention-days: 14
      - name: Commit forward evidence only, never official picks or accounts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/ncaaf-v33-health.json dashboard/ncaaf-v34-settlement-health.json dashboard/ncaaf-v35-eligibility.json research/ncaaf-forward/
          if ! git diff --cached --quiet; then
            git commit -m "Archive NCAAF read-only orderbook and settlement research [skip ci]"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published research safely"
                exit 0
              fi
              echo "main moved concurrently; retrying ($attempt of 5)" >&2
              sleep $((attempt*2))
            done
            echo "Could not publish research after 5 retries" >&2
            exit 1
          else
            echo "No forward changes"
          fi
