name: Validate capper consensus ledger
on:
  push:
    branches: [main]
    paths:
      - 'dashboard/capper-submissions.json'
      - 'scripts/build_capper_consensus.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capper-ledger
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate reviewed bets and grade settled results
        run: python scripts/build_capper_consensus.py
      - name: Publish verified ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/capper-consensus.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish reviewed capper consensus [skip ci]"
            git pull --rebase origin main
            git push
          fi
