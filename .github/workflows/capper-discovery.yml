name: Discover public capper posts
on:
  schedule:
    - cron: '20 13,15,17,19,21,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capper-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public leads (not verified picks)
        run: python scripts/collect_capper_leads.py
      - name: Commit changed leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/capper-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public capper discovery leads [skip ci]"
            git push
          fi
