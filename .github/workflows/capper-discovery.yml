name: Discover public capper posts
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_capper_leads.py'
      - '.github/workflows/capper-discovery.yml'
  schedule:
    - cron: '13 12,14,16,18,20,22,23 * * *'
    - cron: '41 13,15,17,19,21 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: capper-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Discover public leads (not verified picks)
        run: python scripts/collect_capper_leads.py
      - name: Commit changed leads
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/capper-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Update public capper discovery leads [skip ci]"
            git pull --rebase origin main
            git push
          fi
      - name: Make upstream failures visible
        run: |
          python - <<'PY'
          import json, sys
          feed=json.load(open("dashboard/capper-discovery.json"))
          print("Source scan status:",feed.get("scanHealth"),"fresh leads:",feed.get("freshLeadsThisRun"))
          for x in feed.get("sourceStatus",[]):
              print(x["capperId"],x["status"],x.get("provider"),x.get("errors"))
          if feed.get("scanHealth")=="FAILED":
              print("::error::All capper source providers were unavailable; today's picks were not checked")
              sys.exit(1)
          if feed.get("scanHealth")=="DEGRADED":
              print("::warning::Some capper source providers failed; do not treat scan as complete")
          PY
