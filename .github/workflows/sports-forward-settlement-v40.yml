name: Four-sport independently corroborated outcomes v4.0
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sports-forward-settlement-v40.yml'
      - 'models/sport_moneyline_settlement_v40.py'
      - 'models/test_sport_moneyline_settlement_v40.py'
  schedule:
    - cron: '35 11,23 * * *'
permissions:
  contents: read
jobs:
  settled:
    concurrency:
      group: sports-forward-v40
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify exact-match, postgame final and outcome sanity
        run: |
          PYTHONPATH=models python -m unittest discover -s models -p 'test_sport_moneyline_forward_v40.py' -v
          PYTHONPATH=models python -m unittest discover -s models -p 'test_sport_moneyline_settlement_v40.py' -v
      - name: Confirm historical game finals against independent settled Kalshi markets
        run: |
          python models/sport_moneyline_settlement_v40.py \
            --archive-dir research/sports-forward \
            --output dashboard/sports-v40-result-health.json
      - name: Check all scorecards are research only and lack a fabricated model edge
        run: |
          python - <<'PY'
          import json
          d=json.load(open("dashboard/sports-v40-result-health.json"))
          assert not d["official_eligible"] and not d["shadow_eligible"] and not d["production_eligible"]
          assert set(d["leagues"])=={"NFL","NBA","NHL","NCAAB","MLB","WNBA"}
          for sport in ("NFL","NBA","NHL","NCAAB"):
              r=d["leagues"][sport]
              assert r["independent_model_brier"] is None
              assert r["independent_model_vs_market_edge"] is None
              assert r["hypothetical_profit"] is None
              assert r["official_eligible"] is False
          print("No profit assertions or user wagers")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: four-sport-independent-settlement-research
          path: dashboard/sports-v40-result-health.json
          retention-days: 14
      - name: Publish only verified research outcome evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/sports-v40-result-health.json research/sports-forward/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Score independently settled four-sport moneyline research [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo "Outcome publish failed after safe retries" >&2
          exit 1
