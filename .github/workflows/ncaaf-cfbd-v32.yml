name: NCAAF CFBD independent probability research v3.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'models/ncaaf_cfbd_model_v32.py'
      - 'models/test_ncaaf_cfbd_v32.py'
      - '.github/workflows/ncaaf-cfbd-v32.yml'
  schedule:
    - cron: '35 13 * * 5,6'
permissions:
  contents: read
concurrency:
  group: ncaaf-cfbd-v32
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Offline safety and mapping tests
        run: |
          PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_cfbd_v32.py' -v
      - name: Train 2024, calibrate 2025, evaluate 2026, map pregame FBS moneylines
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then echo "Missing CFBD_API_KEY" >&2; exit 1; fi
          python models/ncaaf_cfbd_model_v32.py --board kalshi/ncaafb-candidates.json --output ncaaf-cfbd-v32-research.json --health dashboard/ncaaf-v32-health.json
      - name: Archive research-only details
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-v32-independent-research
          path: |
            ncaaf-cfbd-v32-research.json
            dashboard/ncaaf-v32-health.json
          retention-days: 14
      - name: Commit sanitized diagnostics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git rebase origin/main
          git add dashboard/ncaaf-v32-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Update CFBD NCAAF v3.2 research-only validation health [skip ci]"
            git push origin HEAD:main
          else
            echo "No change to health report"
          fi
