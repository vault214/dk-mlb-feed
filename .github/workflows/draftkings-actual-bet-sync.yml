name: DraftKings Actual Bet Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "5 12 * * *"

concurrency:
  group: draftkings-actual-bet-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
      GOOGLE_SHEET_ID: 1yTkEAnkNQ6MEKZLBQ0Imd_47hzGUQ1LL2fop2N1tcrQ
      GOOGLE_WORKSHEET_BETS: Bets
      DK_STORAGE_STATE_GZ_B64: ${{ secrets.DK_STORAGE_STATE_GZ_B64 }}
      GOOGLE_SERVICE_ACCOUNT_JSON_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: dk-cloud-sync/requirements.txt

      - name: Install Python dependencies
        run: pip install -r dk-cloud-sync/requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$DK_STORAGE_STATE_GZ_B64" || { echo "Missing DK_STORAGE_STATE_GZ_B64"; exit 1; }
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON_B64" || { echo "Missing GOOGLE_SERVICE_ACCOUNT_JSON_B64"; exit 1; }

      - name: Sync DraftKings actual bets
        run: python dk-cloud-sync/sync.py
