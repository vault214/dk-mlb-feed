name: NCAAF daily independent settlement verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ncaaf-settlement-daily-v36.yml'
  schedule:
    - cron: '25 08,20 * * *'
permissions:
  contents: read
concurrency:
  group: ncaaf-forward-v33
  cancel-in-progress: false
jobs:
  settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check settlement source, identity and idempotence tests
        run: PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_settlement_v34.py' -v
      - name: Corroborate Kalshi market outcomes with independent CFBD final scores
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          if [ -z "$CFBD_API_KEY" ]; then echo "CFBD key unavailable" >&2; exit 1; fi
          python models/ncaaf_settlement_verify_v34.py \
            --archive-dir research/ncaaf-forward \
            --health dashboard/ncaaf-v34-settlement-health.json
      - name: Prohibit result promotion and private-ledger edits
        run: |
          python - <<'PY'
          import json,glob
          d=json.load(open("dashboard/ncaaf-v34-settlement-health.json"))
          assert not d["official_eligible"] and not d["production_eligible"] and not d["shadow_eligible"]
          for p in glob.glob("research/ncaaf-forward/20??-??-??.json"):
              a=json.load(open(p))
              assert a["sport"]=="NCAAF"
              assert all(x["official_eligible"] is False for x in a.get("verified_outcomes",{}).values())
          print("Only independent settlement research updated")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: daily-ncaaf-independent-settlement
          path: dashboard/ncaaf-v34-settlement-health.json
          retention-days: 14
      - name: Publish independent research only, with safe concurrent push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/ncaaf-v34-settlement-health.json research/ncaaf-forward/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update independently confirmed NCAAF outcomes [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo "Research publication failed after 5 retries" >&2
          exit 1
