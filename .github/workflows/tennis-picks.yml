name: Capture and settle tennis paper picks
on:
  push:
    branches: [main]
    paths:
      - 'models/tennis_picks.py'
      - '.github/workflows/tennis-picks.yml'
  schedule:
    - cron: '24 1,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tennis-paper-picks
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python models/tennis_picks.py
      - name: Publish tennis ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/tennis-picks.json
          if ! git diff --cached --quiet; then
            git commit -m "Update tennis paper picks [skip ci]"
            git pull --rebase origin main
            git push
          fi
