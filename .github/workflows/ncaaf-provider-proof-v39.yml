name: NCAAF primary publisher source provenance v3.9
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ncaaf-provider-proof-v39.yml'
      - 'models/ncaaf_provider_proof_v39.py'
      - 'models/test_ncaaf_provider_proof_v39.py'
  schedule:
    - cron: '31 14 * * 5,6'
permissions:
  contents: read
concurrency:
  group: ncaaf-provider-proof-v39
  cancel-in-progress: false
jobs:
  verify-official-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Test official conference publisher provenance against forged or guessed URLs
        run: PYTHONPATH=models python -m unittest discover -s models -p 'test_ncaaf_provider_proof_v39.py' -v
      - name: Inspect actual conference html for an authorized football report viewer
        run: |
          python models/ncaaf_provider_proof_v39.py \
            --queue dashboard/ncaaf-v34-availability-health.json \
            --output dashboard/ncaaf-v39-provider-proof.json
      - name: Prohibit inferred QB status or official picks from provider links
        run: |
          python - <<'PY'
          import json
          d=json.load(open("dashboard/ncaaf-v39-provider-proof.json"))
          assert not d["official_eligible"] and not d["shadow_eligible"] and not d["production_eligible"]
          assert all(not g["final_report_for_this_game_verified"]
                     and not g["both_starting_qbs_verified"]
                     and not g["official_eligible"] for g in d["games"])
          print("Official publisher link provenance is separated from game report evidence")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ncaaf-official-provider-source-proof
          path: dashboard/ncaaf-v39-provider-proof.json
          retention-days: 14
      - name: Commit sanitized source availability evidence only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/ncaaf-v39-provider-proof.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh official NCAAF publisher source provenance [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          echo "Cannot publish provider provenance after rebased retries" >&2
          exit 1
